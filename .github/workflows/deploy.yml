name: Deploy to Cloudflare Workers

# Auto-deploy on every push to master: install → prisma generate → OpenNext
# build (webpack) → wrangler deploy. Mirrors the local `npm run cf:deploy`,
# but runs on Linux (no Windows symlink/Developer-Mode issue).
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - 94e06e384b7fd4cda6e09347ca7b5731
#   DATABASE_URL, AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET
#     - needed at BUILD time (next build reads them); the same values are
#       already set as Worker runtime secrets and are preserved across deploys.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not ci): the committed lockfile is generated on Windows
        # and omits Linux-only optional deps (@emnapi/*, magicast); strict `npm
        # ci` rejects that. `npm install` reconciles per-platform. Runs
        # postinstall (prisma generate) too.
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test
        run: npm test

      - name: Build (OpenNext + webpack)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          # VAPID public key is public by design (ships in the client bundle),
          # so it lives here in plaintext, not in a repo secret. The private
          # half exists only as a vocab-reminder Worker secret.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BOAluC_Fn369or-pnOoB8-Ts4oLZXuIdLr9a6SvGKB5XUnBTEPoni1C_nNPd8u3qOlNRIFhtM6NUVADP6nSPmqg

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
