<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- App icon source: 小橙狐 mascot face (hi mood) on a warm cream field.
       Fox is kept within the maskable safe zone (~40% radius) so circular
       masks don't clip the ear tips. Render to PNGs via scripts/gen-icons.mjs. -->
  <rect width="512" height="512" fill="#FFF3EC"/>
  <g transform="translate(52,76) scale(3.4)" stroke-linejoin="round">
    <!-- ears -->
    <polygon points="30,40 22,8 52,30" fill="#FF6A3D" stroke="#1A1A1A" stroke-width="3.5"/>
    <polygon points="90,40 98,8 68,30" fill="#FF6A3D" stroke="#1A1A1A" stroke-width="3.5"/>
    <polygon points="33,36 31,19 45,30" fill="#FFB68F"/>
    <polygon points="87,36 89,19 75,30" fill="#FFB68F"/>
    <!-- face base -->
    <ellipse cx="60" cy="62" rx="40" ry="36" fill="#FF6A3D" stroke="#1A1A1A" stroke-width="3.5"/>
    <ellipse cx="60" cy="78" rx="26" ry="16" fill="#FFF7F2"/>
    <ellipse cx="33" cy="69" rx="7" ry="5" fill="#FFB68F"/>
    <ellipse cx="87" cy="69" rx="7" ry="5" fill="#FFB68F"/>
    <!-- eyes -->
    <circle cx="47" cy="54" r="6" fill="#1A1A1A"/>
    <circle cx="73" cy="54" r="6" fill="#1A1A1A"/>
    <circle cx="49" cy="52" r="2" fill="#ffffff"/>
    <circle cx="75" cy="52" r="2" fill="#ffffff"/>
    <!-- nose + mouth -->
    <ellipse cx="60" cy="71" rx="4.5" ry="3.5" fill="#1A1A1A"/>
    <path d="M52 80 Q60 87 68 80" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
